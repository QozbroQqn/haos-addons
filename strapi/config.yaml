name: Strapi
version: "1.2.3"
slug: strapi
description: Headless CMS Strapi as HAOS Add-on
homeassistant: 2025.11.1
url: https://github.com/QozbroQqn/haos-addons/tree/main/strapi
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
panel_icon: mdi:application-braces
ingress: false
ingress_port: 1337
panel_admin: false
# Share the host's network stack instead of publishing a port from the bridge
# network. A published port has no IPv6 path on Home Assistant OS — Docker runs
# without IPv6 there, so the bridge only carries IPv4 to the outside. Measured
# on a Raspberry Pi 5 host: port 8123 answers over IPv6 because Home Assistant
# core itself runs on the host network, while a published add-on port fails
# even on [::1]. Media served from this add-on therefore did not load for a
# browser that reached the dashboard over IPv6, as `homeassistant.local` does.
#
# `ports` stays for documentation; under host networking the mapping has no
# effect, the port below is simply the one the process binds.
host_network: true
ports:
  1337/tcp: 1337
webui: http://[HOST]:[PORT:1337]/admin
watchdog: http://[HOST]:[PORT:1337]
apparmor: true
privileged: []
map:
  - type: addon_config
    read_only: false

options:
  # If left empty, run.sh will generate secure defaults on first start
  app_keys: ""
  api_token_salt: ""
  admin_jwt_secret: ""
  jwt_secret: ""
  transfer_token_salt: ""
  encryption_key: ""
  max_refresh_token_lifespan: 7
  max_session_lifespan: 30

  node_env: development
  url: ""
  serve_admin: true
  plugins: []

schema:
  app_keys: password?
  api_token_salt: password?
  admin_jwt_secret: password?
  jwt_secret: password?
  transfer_token_salt: password?
  encryption_key: password?
  max_refresh_token_lifespan: int(1,)?
  max_session_lifespan: int(1,)?

  node_env: list(production|development)?
  url: str?
  serve_admin: bool
  plugins:
    - str
